<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HF780 Diary</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --desk:#DDE6EC;
  --paper:#F8EDD1;
  --paper-2:#F3E4C2;
  --line:rgba(0,117,190,.20);
  --ink:#243B57;
  --navy:#2B4566;
  --blue:#0075BE;
  --blue-dark:#005F99;
  --yellow:#FFCC33;
  --note:#FFF0B0;
  --grey:#B3C4CC;
  --grey-dark:#5C6772;
  --err:#A23B2A;
  --display:'Fraunces',Georgia,serif;
  --hand:'Caveat','Segoe Print',cursive;
  --ui:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .45 0 0 0 0 .35 0 0 0 0 .2 0 0 0 .11 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font:400 17px/1.5 var(--ui);padding:18px 12px 0;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{display:inline-flex;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1[tabindex='-1']:focus{outline:none}

.demo-note{max-width:700px;margin:0 auto 14px;font:600 .85rem var(--ui);color:var(--navy);background:var(--note);padding:8px 14px;border-radius:2px;box-shadow:0 1px 3px rgba(36,59,87,.25);transform:rotate(-.4deg)}
.book{position:relative;width:100%;max-width:700px;margin:0 auto 120px}
.book::before,.book::after{content:"";position:absolute;border-radius:4px 10px 10px 4px;background:var(--paper-2);box-shadow:0 1px 2px rgba(36,59,87,.25);z-index:0}
.book::before{inset:7px -7px -7px 7px}
.book::after{inset:13px -13px -13px 13px;background:#EADBB5}
.stage{position:relative;z-index:1;perspective:2600px}
.stage.flipping{pointer-events:none}
.paper{
  position:relative;min-height:calc(100vh - 150px);padding:26px 28px 40px 62px;overflow:hidden;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px),var(--grain);
  background-position:0 20px,0 0;
  border-radius:4px 10px 10px 4px;
  box-shadow:0 18px 34px -20px rgba(36,59,87,.6),0 1px 0 rgba(255,255,255,.6) inset;
}
.paper::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:34px;pointer-events:none;
  background:radial-gradient(circle at 17px 50%,#41505f 0 4.5px,#cfc4a3 5px 6.5px,transparent 7px) 0 20px/34px 64px repeat-y,
             linear-gradient(90deg,rgba(36,59,87,.12),transparent);
}
.paper.fade{animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}

.leaf{position:absolute;inset:0;z-index:5;transform-style:preserve-3d;transform-origin:left center;will-change:transform}
.leaf.fwd{animation:flipFwd .95s cubic-bezier(.5,.05,.2,1) both}
.leaf.back{animation:flipBack .95s cubic-bezier(.5,.05,.2,1) both}
@keyframes flipFwd{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes flipBack{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 10px 10px 4px}
.face.rear{transform:rotateY(180deg)}
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(36,59,87,0) 30%,rgba(36,59,87,.35));opacity:0}
.leaf.fwd .face.front::after{animation:shade .95s ease both}
.leaf.back .face.front::after{animation:shade .95s ease reverse both}
@keyframes shade{to{opacity:1}}
.rear-paper{position:absolute;inset:0;background-color:var(--paper-2);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px),var(--grain);background-position:0 20px,0 0;
  box-shadow:inset -16px 0 24px -12px rgba(36,59,87,.3)}
@media (prefers-reduced-motion:reduce){.leaf{display:none}.btn,.chip,.tile,.nav .plus .ic{transition:none}}

h1,h2,h3{font-family:var(--display);font-weight:600;color:var(--navy);margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:2.5rem}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:0 0 12px}
.kicker{font:600 .76rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--blue-dark);margin:0 0 8px}
.hand{font-family:var(--hand);font-weight:500}
.lede{font:500 1.55rem/32px var(--hand);color:var(--navy)}
.small{font:500 .86rem/1.45 var(--ui);color:var(--grey-dark)}
.rule{border:0;border-top:1.5px solid rgba(43,69,102,.35);margin:18px 0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 12px}
.section-title h2{font-size:1.15rem}
.section-title span{font:600 .74rem var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--grey-dark)}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.head .brand{display:flex;align-items:center}.head .brand img{height:32px;width:auto}
.brand-text{font:600 1rem var(--display);color:var(--navy)}
.badge{display:flex;align-items:center;line-height:1;gap:10px;font:600 .84rem var(--ui);color:var(--navy)}
.badge .nm{background:#fff;border:1.5px solid var(--navy);border-radius:999px;padding:3px 12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;padding:12px 4px;min-height:44px;min-width:44px;font:600 .84rem var(--ui);letter-spacing:.04em;color:var(--blue-dark);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:#004a78}
.sticker{position:absolute;pointer-events:none;z-index:0}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#0a82cd,#0075BE);
  border-radius:16px 20px 17px 21px / 20px 16px 21px 17px;padding:9px 28px 10px;transform:rotate(-1deg);
  font:600 1.4rem/1.2 var(--hand);letter-spacing:.01em;text-transform:none;
  box-shadow:0 -2px 0 rgba(0,40,80,.3) inset,2px 3px 0 rgba(43,69,102,.35),0 8px 12px -6px rgba(0,60,110,.5);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,background .15s}
.btn::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(255,255,255,.55);border-radius:inherit;pointer-events:none}
.btn:hover{transform:rotate(1deg) translateY(-2px);box-shadow:0 -2px 0 rgba(0,40,80,.3) inset,3px 5px 0 rgba(43,69,102,.35),0 12px 14px -6px rgba(0,60,110,.55)}
.btn:active{transform:rotate(0) translate(2px,3px);box-shadow:0 -2px 0 rgba(0,40,80,.3) inset,0 1px 0 rgba(43,69,102,.35)}
.btn[disabled]{opacity:.5;cursor:default;transform:rotate(-1deg)}
.btn.ghost{background:rgba(255,255,255,.45);color:var(--navy);border:2px solid var(--navy);padding:6px 20px 7px;box-shadow:2px 3px 0 rgba(43,69,102,.25)}
.btn.ghost::after{display:none}
.btn.ghost:hover{background:var(--note);transform:rotate(1deg) translateY(-2px);box-shadow:3px 5px 0 rgba(43,69,102,.3)}
.btn.white{background:linear-gradient(180deg,#fff,#f8f1db);color:var(--navy);box-shadow:0 -2px 0 rgba(43,69,102,.14) inset,2px 3px 0 rgba(0,0,0,.35)}
.btn.white::after{border-color:rgba(43,69,102,.4)}
.btn.white:hover{background:linear-gradient(180deg,#fff,#ffefb0);box-shadow:0 -2px 0 rgba(43,69,102,.14) inset,3px 5px 0 rgba(0,0,0,.35)}
.btn.sm{padding:8px 22px 9px;min-height:44px;font-size:1.25rem}
.btn.ghost.sm{padding:6px 16px 7px;min-height:44px}
.btn .ic{margin-right:-2px}
label,.field-label{display:block;font:600 .78rem var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--navy);margin:0 0 4px}
.field{margin-bottom:22px}
input[type=text],input[type=password],input[type=email]{width:100%;background:transparent;border:0;border-bottom:2px solid var(--navy);border-radius:0;padding:4px 2px;font:500 1.7rem/32px var(--hand);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#6B7068;opacity:1}
.altlinks{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:10px}
.codewrap{position:relative}.codewrap input{padding-right:64px}.codewrap .linkbtn{position:absolute;right:0;bottom:8px}
textarea{width:100%;display:block;resize:vertical;min-height:128px;border:0;background:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(0,117,190,.28) 31px 32px);background-attachment:local;
  padding:0 4px;font:500 1.5rem/32px var(--hand);color:var(--ink)}
.msg{font:600 .92rem/1.4 var(--ui);min-height:1.4em;margin:12px 0 0}
.msg.err{color:var(--err)}

.tape{position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:rgba(255,204,51,.7);transform:rotate(-2.5deg);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.note-card{position:relative;background:var(--note);padding:18px 18px 14px;margin:20px 0 22px;box-shadow:0 3px 8px rgba(36,59,87,.18)}
.note-card .kicker{color:var(--navy)}
.note-card p{margin:0}
.note-card .hand{font-size:1.5rem;line-height:1.3}

.progress{position:relative;background:#fff;padding:16px 18px;box-shadow:0 3px 8px rgba(36,59,87,.18);margin:6px 0 24px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.progress .big{font:600 1.35rem var(--display);color:var(--navy)}
.bar{height:12px;margin:10px 0 14px;background:rgba(43,69,102,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);box-shadow:inset 0 -2px 0 rgba(43,69,102,.18);transition:width .5s}
.dots{display:flex;justify-content:space-between;gap:6px}
.dots span{width:34px;height:34px;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font:600 .85rem var(--ui);color:var(--navy)}
.dots span.done{background:var(--navy);color:#fff}
.dots span.now{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,117,190,.25)}
.dots span.lock{border-style:dashed;border-color:var(--grey);color:var(--grey-dark)}

.cta{position:relative;background:var(--navy);color:#fff;padding:20px 20px 18px;margin:0 0 26px;box-shadow:0 5px 14px rgba(36,59,87,.35)}
.cta h2{color:#fff;font-size:1.35rem;margin-bottom:6px}
.cta p{font:500 1.35rem/1.25 var(--hand);color:#E4ECF4;margin-bottom:14px}

.tiles{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:10px}
.tile{position:relative;background:#fff;border:0;border-radius:8px;padding:14px 6px 12px;text-align:center;justify-content:flex-start;border:1px solid rgba(43,69,102,.12);box-shadow:0 2px 6px rgba(36,59,87,.14);color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s,background .15s}
.tile:nth-child(odd){transform:rotate(-.6deg)}.tile:nth-child(even){transform:rotate(.6deg)}
.tile:hover:not([disabled]){background:#fffaf0;transform:rotate(0) translateY(-3px);box-shadow:0 8px 14px -6px rgba(36,59,87,.4)}
.tile:active:not([disabled]){transform:translateY(0)}
.tile[disabled]{opacity:.5;cursor:default}
.tile .disc{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#DCEBF6;color:var(--blue)}
.tile.y .disc{background:#FFF0B0;color:#8a6a00}
.tile b{font:600 1.15rem/1.1 var(--hand)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dow{font:600 .7rem var(--ui);letter-spacing:.12em;text-align:center;color:var(--grey-dark)}
.cell{position:relative;aspect-ratio:1/1.12;border-radius:3px;padding:0;border:0;background:transparent;color:rgba(43,69,102,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 .95rem var(--ui);overflow:hidden}
.cell .dn{font:600 .6rem var(--ui);letter-spacing:.1em;text-transform:uppercase}
.cell.study{background:#fff;color:var(--navy);box-shadow:0 2px 5px rgba(36,59,87,.22)}
.cell.study:hover:not(.locked){background:var(--note)}
.cell.study .dn{color:var(--blue)}
.cell.today{background:var(--blue);color:#fff}.cell.today .dn{color:#fff}
.cell.locked{background:transparent;box-shadow:none;border:1.5px dashed var(--grey);color:var(--grey-dark);cursor:default}
.cell.locked .dn{color:var(--grey-dark)}
.cell .mo{position:absolute;top:3px;left:5px;font:600 .55rem var(--ui);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.cell .ticks{display:flex;gap:3px;margin-top:3px;min-height:7px}
.cell .ticks b{width:6px;height:6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1px rgba(36,59,87,.45)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .over{position:absolute;left:0;right:0;bottom:0;padding:2px 0 3px;background:rgba(255,255,255,.88);color:var(--navy);font:600 .68rem var(--ui);text-align:center}

.feed{display:flex;flex-direction:column}
.entry{position:relative;padding:18px 0 20px;border-top:1.5px dashed rgba(43,69,102,.3);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;display:block}
.feed .entry:first-child{border-top:0;padding-top:4px}
button.entry:hover .note{color:var(--blue-dark)}
.tag{display:inline-block;background:var(--yellow);color:#1b2b40;padding:1px 9px;border-radius:2px;transform:rotate(-1.2deg);font:600 .7rem var(--ui);letter-spacing:.1em;text-transform:uppercase}
.etime{font:500 .8rem var(--ui);color:var(--grey-dark);margin-left:10px}
.photo{display:inline-block;position:relative;background:#fff;padding:8px 8px 22px;box-shadow:0 3px 10px rgba(36,59,87,.28);transform:rotate(-1.4deg);margin:16px 0 8px;max-width:100%}
.photo::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,204,51,.7);transform:rotate(-3deg)}
.photo img{max-height:300px;width:auto;max-width:100%}
.entry.compact .photo img{max-height:110px}
.entry audio{display:block;margin:12px 0 4px;max-width:100%}
.entry .note{font:500 1.5rem/32px var(--hand);margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.entry.compact .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.empty{font:500 1.4rem/32px var(--hand);color:var(--grey-dark)}

.backlink{margin:0 0 6px;display:inline-flex;align-items:center;gap:6px}
.dateline{font:500 1.7rem/32px var(--hand);color:var(--grey-dark);margin:8px 0 6px}
.welcome-logo{margin:4px 0 26px}.welcome-logo img{height:76px;width:auto;max-width:100%}
@media (max-width:600px){.welcome-logo img{height:56px}}

.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,700px);z-index:30;display:flex;justify-content:space-around;align-items:flex-end;
  padding:8px 20px calc(10px + env(safe-area-inset-bottom));background:rgba(251,244,225,.96);border-top:1.5px solid rgba(43,69,102,.3);backdrop-filter:blur(6px)}
.nav[hidden]{display:none}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--grey-dark);font:600 .72rem var(--ui);letter-spacing:.06em;padding:4px 12px}
.nav button.on{color:var(--blue-dark)}
.nav .plus{margin-top:-30px;background:linear-gradient(180deg,#0a82cd,#0075BE);color:#fff;border-radius:50%;width:58px;height:58px;justify-content:center;padding:0;border:4px solid #FBF4E1;box-shadow:0 6px 14px rgba(0,117,190,.45),0 -2px 0 rgba(0,40,80,.25) inset;transition:transform .15s}
.nav .plus:active{transform:scale(.94)}
.nav .plus .ic{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.nav .plus:hover .ic{transform:rotate(90deg)}
.nav .plus:hover{background:linear-gradient(180deg,#0c8bd9,#0069ad)}
.nav .plus[disabled]{opacity:.5}

.scrim{position:fixed;inset:0;background:rgba(36,59,87,.55);z-index:40;animation:fade .2s both}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,640px);max-height:92vh;overflow-y:auto;z-index:41;
  background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px),var(--grain);background-position:0 12px,0 0;
  border-radius:18px 18px 0 0;padding:22px 24px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.x{background:#fff;border:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:0 1px 3px rgba(36,59,87,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:6px 14px 7px 15px / 14px 7px 15px 6px;padding:5px 14px 6px;font:600 1.15rem/1.2 var(--hand);color:var(--navy);
  border:1px solid rgba(43,69,102,.45);box-shadow:1px 2px 0 rgba(43,69,102,.3);transform:rotate(-1.2deg);min-height:44px;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .15s}
.chip:nth-child(even){transform:rotate(1deg)}
.chip:hover{transform:rotate(0) translateY(-2px)}
.chip[aria-pressed=true]{background:var(--yellow);color:#1b2b40;box-shadow:2px 3px 0 rgba(43,69,102,.45);transform:rotate(-1deg) scale(1.04)}
.attach{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.attach input[type=file]{display:none}
.attach label.btn{margin:0;cursor:pointer;letter-spacing:.06em}
.preview{margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px}
.preview>div{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:100%}
.preview img{max-height:140px;width:auto;border:6px solid #fff;box-shadow:0 2px 8px rgba(36,59,87,.25)}
.preview audio{max-width:100%}
.guide li{margin:0 0 10px}
.guide ul{padding-left:20px;margin:12px 0 0}
.stamp-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:stampOut .4s ease 1.7s both}
.stamp-wrap svg{width:180px;height:180px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes stampOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp-wrap svg,.sheet,.scrim{animation:none}}

@media (max-width:640px){
  body{padding:10px 8px 0}
  .paper{padding:20px 16px 34px 46px}
  .paper::before{width:28px;background:radial-gradient(circle at 14px 50%,#41505f 0 4.5px,#cfc4a3 5px 6.5px,transparent 7px) 0 20px/28px 64px repeat-y,linear-gradient(90deg,rgba(36,59,87,.12),transparent)}
  h1{font-size:2.1rem}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tiles .tile:last-child:nth-child(odd){grid-column:1/-1}
  .badge .nm{max-width:96px}
  .cal{gap:5px}
  .book::before{inset:6px -4px -6px 4px}.book::after{inset:11px -7px -11px 7px}
  .sticker.hide-sm{display:none}
}
</style>
</head>
<body>
<noscript><p style="padding:24px">This diary needs JavaScript to run.</p></noscript>
<main id="app">
  <div id="demo"></div>
  <div class="book"><div class="stage" id="stage"></div></div>
  <nav class="nav" id="nav" hidden aria-label="Diary navigation"></nav>
  <div class="sr" id="live" aria-live="polite" role="status"></div>
</main>

<script>
(function(){
'use strict';

const CFG = window.DIARY_CONFIG || {};
const LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !/YOUR_/i.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY));

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

function authHeaders(){
  const k = CFG.SUPABASE_ANON_KEY, o = {apikey:k};
  if (k.startsWith('eyJ')) o.Authorization = 'Bearer ' + k;
  return o;
}
async function rpc(fn, args){
  const r = await fetch(CFG.SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST', headers:Object.assign({},authHeaders(),{'Content-Type':'application/json'}), body:JSON.stringify(args)
  });
  let body = null; try{ body = await r.json(); }catch(e){}
  if (!r.ok){
    const code = (body && (body.message || body.error)) || 'request_failed';
    const err = new Error(code); err.code = code; throw err;
  }
  return body;
}

function prepClone(src){
  const c = src.cloneNode(true);
  c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  c.querySelectorAll('input,textarea,button,a,audio,video,select').forEach(e => { e.setAttribute('tabindex','-1'); if (e.pause) e.pause(); });

/* page-turn sound: a short synthesized paper swish (no audio file needed) */
let audioCtx = null, soundOn = true, soundFreeAt = 0;
// Sounds queue up: each one starts only after the previous one has finished.
function slot(ctx, dur){ const t = Math.max(ctx.currentTime, soundFreeAt); soundFreeAt = t + dur + 0.05; return t; }
try{ soundOn = localStorage.getItem('hf780_sound') !== 'off'; }catch(e){}
function setSound(on){ soundOn = on; try{ localStorage.setItem('hf780_sound', on ? 'on' : 'off'); }catch(e){} }
function pageSound(dir){
  if (!soundOn) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const ctx = audioCtx, dur = 0.5, t = slot(ctx, dur);
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    const a = dir === 'back' ? [4800, 1600] : [1600, 4800];
    bp.frequency.setValueAtTime(a[0], t); bp.frequency.exponentialRampToValueAtTime(a[1], t + dur * 0.8);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.07);
    g.gain.exponentialRampToValueAtTime(0.12, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
    // soft thump as the page lands
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.frequency.setValueAtTime(110, t + dur * 0.7); o.frequency.exponentialRampToValueAtTime(55, t + dur);
    og.gain.setValueAtTime(0.0001, t + dur * 0.7); og.gain.exponentialRampToValueAtTime(0.18, t + dur * 0.76); og.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);
    o.connect(og); og.connect(ctx.destination); o.start(t + dur * 0.7); o.stop(t + dur + 0.1);
  }catch(e){}
}
/* writing sound for Post: a few quick pencil strokes, synthesized */
function writeSound(){
  if (!soundOn) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const ctx = audioCtx, t0 = slot(ctx, 0.75);
    const strokes = [[0, .13, 3200], [.15, .11, 4200], [.29, .15, 3000], [.46, .1, 4600], [.58, .17, 3400]];
    strokes.forEach(([at, len, f]) => {
      const t = t0 + at;
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * len), ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.2;
      bp.frequency.setValueAtTime(f, t); bp.frequency.linearRampToValueAtTime(f * 0.8, t + len);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + len * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
    });
  }catch(e){}
}
function swap(page, dir){
  if (finishFlip) finishFlip();
  const old = stage.querySelector('.paper');
  if (!old || !dir || REDUCED){
    stage.replaceChildren(page);
    if (old && REDUCED) page.classList.add('fade');
    return;
  }
  window.scrollTo(0,0);
  pageSound(dir);
  stage.style.minHeight = Math.max(old.offsetHeight, 520) + 'px';
  stage.classList.add('flipping');
  const leaf = h('div',{class:'leaf '+dir,'aria-hidden':'true'});
  const front = h('div',{class:'face front'});
  const rear = h('div',{class:'face rear'}, h('div',{class:'rear-paper'}));
  if (dir === 'fwd'){
    front.append(prepClone(old));
    leaf.append(front, rear);
    old.remove(); stage.append(page, leaf);
  } else {
    // going back: the leaf starts turned over (showing the page we return to) and swings closed onto the old page
    stage.append(leaf);
    page.style.position = 'absolute'; page.style.inset = '0';
    front.append(page);
    leaf.append(front, rear);
  }
  finishFlip = () => {
    finishFlip = null; leaf.remove();
    if (dir === 'back'){ page.style.position = ''; page.style.inset = ''; old.remove(); stage.append(page); }
    stage.classList.remove('flipping'); stage.style.minHeight = '';
  };
  leaf.addEventListener('animationend', e => { if (e.target === leaf && finishFlip) finishFlip(); });
  setTimeout(() => { if (finishFlip) finishFlip(); }, 1400);
}

  const finish = async (n, c, m) => { meta = m; session = {name:m.name || n, code:c}; saveSession(); await loadEntries(); go('#/home'); };

  if (mode === 'create'){
    const code = codeField('f-code','Make a code');
    const email = h('input',{id:'f-email',type:'email',autocomplete:'email',maxlength:'120',required:true,placeholder:'name@example.com'});
    label = 'Create my diary'; heading = 'Create your diary';
    intro = 'Pick a name and make up a code you will remember. You will use them to come back on any device.';
    fields = [nameField, code.node, h('div',{class:'field'}, h('label',{for:'f-email'},'Your email'), email,
      h('p',{class:'small',style:'margin:6px 0 0'},'Used only to send one reminder each evening at 7 PM during the study, and a reset code if you forget your code. You will not need it to log in.'))];
    links = [h('button',{class:'linkbtn',type:'button',onclick:()=>setMode('open')},'Already have a diary? Open it')];
    onSubmit = async () => {
      const n = name.value.trim(), c = code.input.value, em = email.value.trim();
      if (!n || c.length < 4){ throw {code:'invalid'}; }
      if (!EMAIL_RE.test(em)) throw {code:'invalid_email'};
      await finish(n, c, await api.create(n, c, em));
    };
  } else if (mode === 'open'){
    const code = codeField('f-code','Your code','Your code');
    label = 'Open my diary'; heading = 'Open your diary';
    intro = 'Use the same name and code you made, on this device or any other.';
    fields = [nameField, code.node];
    links = [h('button',{class:'linkbtn',type:'button',onclick:()=>setMode('forgot')},'Forgot code?'),
             h('button',{class:'linkbtn',type:'button',onclick:()=>setMode('create')},'New here? Create a diary')];
    onSubmit = async () => {
      const n = name.value.trim(), c = code.input.value;
      if (!n || !c) throw {code:'wrong_code'};
      await finish(n, c, await api.open(n, c));
    };
  } else if (mode === 'forgot'){
    label = 'Send me a reset code'; heading = 'Forgot your code?';
    intro = 'Type your name. If it has an email on file, we will send a 6-digit reset code to that email.';
    fields = [nameField];
    links = [h('button',{class:'linkbtn',type:'button',onclick:()=>setMode('open')},'Back to open my diary')];
    onSubmit = async () => {
      const n = name.value.trim();
      if (!n) throw {code:'invalid'};
      await api.requestReset(n);
      setMode('reset', LIVE ? 'If that name has an email on file, a code is on its way. It works for 30 minutes.' : 'Preview mode: no email is sent.');
    };
  } else {
    const token = h('input',{id:'f-token',type:'text',inputmode:'numeric',autocomplete:'one-time-code',maxlength:'6',required:true,placeholder:'6-digit code'});
    const code = codeField('f-code','Make a new code');
    label = 'Save new code and open'; heading = 'Reset your code';
    intro = 'Enter the 6-digit code from your email, then choose a new code.';
    fields = [nameField, h('div',{class:'field'}, h('label',{for:'f-token'},'Reset code from email'), token), code.node];
    links = [h('button',{class:'linkbtn',type:'button',onclick:()=>setMode('forgot')},'Send a new reset code'),
             h('button',{class:'linkbtn',type:'button',onclick:()=>setMode('open')},'Back to open my diary')];
    onSubmit = async () => {
      const n = name.value.trim(), t = token.value.trim(), c = code.input.value;
      if (!n || !t || c.length < 4) throw {code:'invalid'};
      await finish(n, c, await api.resetCode(n, t, c));
    };
  }
  btn.textContent = label;
  const form = h('form',{novalidate:true,onsubmit: async ev => {
    ev.preventDefault(); err.textContent = '';
    btn.disabled = true; btn.textContent = 'One moment...';
    try{ await onSubmit(); }catch(e){ session = null; fail(e); }
  }}, fields, note, btn, err, h('div',{class:'altlinks'}, links));

  return h('article',{class:'paper'},
    leafSticker('', 'right:18px;top:14px;width:54px;height:54px;transform:rotate(18deg)'),
    h('div',{class:'welcome-logo'}, logo()),
    h('p',{class:'kicker'},'A one-week diary'),
    h('h1',{},'My Week in Moments'),
    h('hr',{class:'rule'}),
    h('p',{class:'lede'},'For the next six days, you will keep a small diary of moments from your everyday life. Anything counts, and there are no right or wrong answers.'),
    h('p',{class:'small'},'Your entries are only used for this class project. You can skip any entry or stop at any time.'),
    h('h2',{style:'margin:30px 0 6px'}, heading),
    h('p',{class:'small',style:'margin-bottom:22px'}, intro),
    form);
}

/* ---------- page: home ---------- */
function pageHome(){
  const start = startD(), end = addDays(start,5), ph = phase(), tn = todayN();
  const done = [1,2,3,4,5,6].filter(i => countFor(i)).length;
  const dotsRow = h('div',{class:'dots','aria-hidden':'true'}, [1,2,3,4,5,6].map(i =>
    h('span',{class: countFor(i) ? 'done' : i === tn ? 'now' : dayStatus(i) === 'locked' ? 'lock' : ''}, String(i))));
  const bigText = ph === 'during' ? 'Day '+tn+' of 6' : ph === 'before' ? 'Starts soon' : 'All six days done';
  const progress = h('div',{class:'progress'}, h('span',{class:'tape'}),
    h('div',{class:'row'}, h('span',{class:'big'}, bigText),
      h('span',{class:'small'}, entries.length+' '+(entries.length === 1 ? 'entry' : 'entries')+' so far')),
    h('div',{class:'bar',role:'progressbar','aria-valuemin':'0','aria-valuemax':'6','aria-valuenow':String(done),'aria-label':'Days with an entry'}, h('i',{style:'width:'+Math.round(done/6*100)+'%'})),
    dotsRow);

  let noteText, noteBtn = null;
  if (ph === 'before') noteText = 'Your first page opens on '+fmtLong(start)+'.';

  else { noteText = 'Today: '+PROMPTS[tn].title; noteBtn = h('button',{class:'btn sm',type:'button',style:'margin-top:12px',onclick:()=>go('#/day/'+tn)}, 'Open Day '+tn); }
  const note = h('div',{class:'note-card'}, h('span',{class:'tape'}),

    h('h2',{}, 'Something worth writing down?'),
    h('p',{}, 'Add a photo, a voice memo, or a few words to today\'s page.'),
    h('button',{class:'btn white',type:'button',disabled: td ? null : true,onclick:()=>td && openSheet(td)}, td ? 'Add to today\'s page' : 'Opens on Day 1'));

    h('span',{class:'disc'}, icon(KINDS[k].icon,20)), h('b',{}, KINDS[k].tile))));

  const first = addDays(start, -start.getDay()), last = addDays(end, 6 - end.getDay());

  for (let d = new Date(first); d <= last; d = addDays(d,1)){
    const idx = Math.round((d - start) / 86400000) + 1;
    const mo = (d.getDate() === 1 || ymd(d) === ymd(first)) ? h('span',{class:'mo','aria-hidden':'true'}, d.toLocaleDateString(undefined,{month:'short'})) : null;
    if (idx >= 1 && idx <= 6){
      const st = dayStatus(idx), cnt = countFor(idx);
      const shot = entries.find(e => e.study_day === idx && e.media_path && e.media_type && e.media_type.startsWith('image/'));
      const label = d.getDate()+' Day '+idx+', '+fmtLong(d)+(cnt ? ', '+cnt+' '+(cnt === 1 ? 'entry' : 'entries') : '')+(st === 'locked' ? ', not open yet' : '');

/* ---------- bottom sheet: add an entry ---------- */
let sheetEl = null, scrimEl = null, composer = null, keyHandler = null, opener = null;
function setInert(on){ ['.book','#nav','#demo'].forEach(q => { const e = $(q); if (e){ if (on) e.setAttribute('inert',''); else e.removeAttribute('inert'); } }); }
function closeSheet(){
  if (composer){
    if (composer.rec){ composer.discard = true; try{ composer.rec.stop(); }catch(e){} }
    clearTimeout(composer.timer);
    (composer.urls || []).forEach(u => URL.revokeObjectURL(u));
    composer = null;
  }
  if (sheetEl){ sheetEl.remove(); scrimEl.remove(); sheetEl = scrimEl = null; setInert(false);
    if (opener && document.contains(opener)) opener.focus();
    opener = null; }
  if (keyHandler){ document.removeEventListener('keydown', keyHandler); keyHandler = null; }
}
function openSheet(n, kind){
  const from = document.activeElement;
  closeSheet();
  opener = from && from !== document.body ? from : null;
  const allowed = ['prompt','feels_like_me'].concat(NOT_FOR_ME_DAYS.includes(n) ? ['not_for_me'] : [], ['movement']);
  composer = {kind:kind && allowed.includes(kind) ? kind : 'prompt', photo:null, audio:null, urls:[], rec:null, timer:null, discard:false};
  const P = PROMPTS[n];
  const promptBox = h('div',{class:'note-card',style:'margin:8px 0 12px'}, h('span',{class:'tape'}), h('p',{class:'kicker'}, 'Prompt: '+P.title), h('p',{class:'hand'}, P.text));
  const help = h('p',{class:'small',style:'margin:0 0 12px'});
  const noteLabel = h('label',{for:'note'});
  const note = h('textarea',{id:'note',rows:'4',maxlength:'2000'});
  const preview = h('div',{class:'preview'});
  const msg = h('p',{class:'msg err',role:'alert'});
  const post = h('button',{class:'btn',type:'button'}, 'Post to my diary');
  const chipRow = h('div',{class:'chips',role:'group','aria-label':'What would you like to add?'});
  const fileIn = h('input',{type:'file',accept:'image/*',id:'file-photo'});
  const audioIn = h('input',{type:'file',accept:'audio/*',id:'file-audio'});
  const photoBtn = h('label',{class:'btn ghost sm',for:'file-photo'}, icon('image',16), ' Photo or screenshot');
  const audioBtn = h('label',{class:'btn ghost sm',for:'file-audio'}, icon('mic',16), ' Upload audio');
  const recBtn = h('button',{class:'btn ghost sm',type:'button'}, icon('mic',16), ' Record voice memo');
  const hasRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  function setKind(k){
    composer.kind = k;
    chipRow.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
    const K = KINDS[k];
    promptBox.style.display = k === 'prompt' ? '' : 'none';
    help.style.display = k === 'prompt' ? 'none' : ''; help.textContent = k === 'prompt' ? '' : K.help;
    noteLabel.textContent = K.label; note.placeholder = K.ph; msg.textContent = '';
  }
  allowed.forEach(k => chipRow.append(h('button',{class:'chip',type:'button','data-k':k,'aria-pressed':'false',onclick:()=>setKind(k)}, icon(KINDS[k].icon,15), KINDS[k].chip)));

  function drawPreview(){
    composer.urls.forEach(u => URL.revokeObjectURL(u)); composer.urls = [];
    const parts = [];
    if (composer.photo){
      const u = URL.createObjectURL(composer.photo); composer.urls.push(u);
      parts.push(h('div',{}, h('img',{src:u,alt:'Preview of your photo'}),
        h('button',{class:'linkbtn',type:'button',onclick:()=>{ composer.photo = null; drawPreview(); }}, 'Remove photo')));
    }
    if (composer.audio){
      const u = URL.createObjectURL(composer.audio); composer.urls.push(u);
      parts.push(h('div',{}, h('audio',{src:u,controls:true,'aria-label':'Preview of your voice memo'}),
        h('button',{class:'linkbtn',type:'button',onclick:()=>{ composer.audio = null; drawPreview(); }}, 'Remove voice memo')));
    }
    preview.replaceChildren(...parts);
  }
  function showMedia(blob){
    if (blob.type.startsWith('image/')) composer.photo = blob; else composer.audio = blob;
    drawPreview();
  }
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; fileIn.value = ''; if (!f) return; msg.textContent = '';
    try{ showMedia(await shrinkImage(f)); }catch(e){ msg.textContent = 'That photo could not be added. Try a different one.'; }
  });
  audioIn.addEventListener('change', () => {
    const f = audioIn.files[0]; audioIn.value = ''; if (!f) return; msg.textContent = '';
    if (f.size > MAX_BYTES){ msg.textContent = 'That audio file is too large. Keep it under 15 MB.'; return; }
    showMedia(f);
  });
  const recLabel = txt => recBtn.replaceChildren(icon('mic',16), ' ' + txt);
  recBtn.addEventListener('click', async () => {
    msg.textContent = '';
    if (composer.rec){ composer.rec.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      if (!composer){ stream.getTracks().forEach(t => t.stop()); return; }
      const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
      const chunks = [], rec = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
      const c = composer;
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        clearTimeout(c.timer); c.rec = null; stream.getTracks().forEach(t => t.stop());
        if (c.discard || composer !== c) return;
        recLabel('Record voice memo');
        const type = (rec.mimeType || mime || 'audio/webm').split(';')[0];
        if (chunks.length) showMedia(new Blob(chunks,{type:type}));
      };
      rec.start(); c.rec = rec; recLabel('Stop recording');
      c.timer = setTimeout(() => { if (c.rec) c.rec.stop(); }, 3 * 60 * 1000);
    }catch(e){ msg.textContent = 'The microphone could not be used. You can upload an audio file instead.'; }
  });

  post.addEventListener('click', async () => {
    msg.textContent = '';
    if (composer.rec){ msg.textContent = 'Stop the recording first, then post.'; return; }
    const text = note.value.trim();
    if (!text && !composer.photo && !composer.audio){ msg.textContent = 'Add a photo, a voice memo, or a few words before you post.'; return; }
    writeSound();
    post.disabled = true; post.textContent = 'Posting...';
    try{
      await api.add(session.name, session.code, {day:n, kind:composer.kind, note:text, photo:composer.photo, audio:composer.audio});
      await loadEntries();
      opener = null; closeSheet(); renderCurrent(); focusHeading(); stampPosted(n);
    }catch(e){
      msg.textContent = e.code === 'upload_failed' ? 'The photo or recording could not be uploaded. Check your connection and try again.'
        : e.code === 'wrong_code' ? 'Your code no longer matches. Please close the diary and open it again.'
        : 'Your entry could not be posted. Check your connection and try again.';
      post.disabled = false; post.textContent = 'Post to my diary';
    }
  });

  scrimEl = h('div',{class:'scrim',onclick:closeSheet});
  sheetEl = h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-labelledby':'sheet-t'},
    h('div',{class:'sheet-head'}, h('div',{}, h('p',{class:'kicker',style:'margin:0'}, 'Day '+n+' · '+fmtShort(dayDate(n))), h('h2',{id:'sheet-t'}, 'Add to your page')),
      h('button',{class:'x',type:'button','aria-label':'Close',onclick:closeSheet}, icon('x',18))),
    chipRow, promptBox, help,
    h('div',{class:'attach'}, photoBtn, fileIn, hasRec ? recBtn : audioBtn, audioIn),
    preview,
    h('div',{class:'field'}, noteLabel, note),
    post, msg);
  document.body.append(scrimEl, sheetEl); setInert(true);
  keyHandler = e => { if (e.key === 'Escape') closeSheet(); };
  document.addEventListener('keydown', keyHandler);
  setKind(composer.kind);
  chipRow.querySelector('[data-k="'+composer.kind+'"]').focus();
}

function stampPosted(n){
  const wrap = h('div',{class:'stamp-wrap',role:'status','aria-live':'polite'});
  wrap.innerHTML = '<svg viewBox="0 0 150 150" aria-label="Entry posted to Day '+n+'"><circle cx="75" cy="75" r="70" fill="#F8EDD1" opacity=".96"/><circle cx="75" cy="75" r="66" fill="none" stroke="#0075BE" stroke-width="4"/><circle cx="75" cy="75" r="56" fill="none" stroke="#0075BE" stroke-width="1.5"/><text x="75" y="72" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="600" font-size="25" fill="#0075BE" letter-spacing="2">POSTED</text><text x="75" y="98" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-weight="600" font-size="13" fill="#0075BE" letter-spacing="3">DAY '+n+'</text></svg>';
  document.body.append(wrap);
  setTimeout(() => wrap.remove(), 2200);
}

function openGuide(){
  const from = document.activeElement;
  closeSheet();
  opener = from && from !== document.body ? from : null;

  sheetEl = h('div',{class:'sheet guide',role:'dialog','aria-modal':'true','aria-labelledby':'guide-t'},
    h('div',{class:'sheet-head'}, h('div',{}, h('p',{class:'kicker',style:'margin:0'}, 'For the next six days'), h('h2',{id:'guide-t'}, 'How this diary works')),
      h('button',{class:'x',type:'button','aria-label':'Close',onclick:closeSheet}, icon('x',18))),
    h('ul',{}, GUIDE.map(t => h('li',{}, t))),
    h('button',{class:'btn',type:'button',style:'margin-top:10px',onclick:closeSheet}, 'Got it'));

async function shrinkImage(file){
  if (!file.type.startsWith('image/')) throw new Error('not image');
  try{
    const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
    const max = 1600, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(res => c.toBlob(res,'image/jpeg',0.82));
    if (blob) return blob;
  }catch(e){}
  if (file.size > MAX_BYTES) throw new Error('too large');
  return file;
}

function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }

/* ---------- routing ---------- */
function focusHeading(announce){
  const hd = stage.querySelector('h1');
  if (hd){ hd.setAttribute('tabindex','-1'); hd.focus({preventScroll:true}); }
  if (announce) $('#live').textContent = announce;
}
let curKey = null, curRank = -1, curBuild = null;
function show(key, rank, build){
  const dir = curKey === null ? null : rank < curRank ? 'back' : (rank > curRank || key !== curKey) ? 'fwd' : null;
  curKey = key; curRank = rank; curBuild = build;
  swap(build(), dir);
  renderNav(rank > 0);
  if (!dir) window.scrollTo(0,0);
  if (dir) focusHeading(key === 'home' ? 'Diary home' : key === 'welcome' ? 'Log in page' : 'Day '+key.slice(3)+' page');
}
function renderCurrent(){ if (curBuild){ swap(curBuild(), null); renderNav(curRank > 0); } }

async function route(){
  closeSheet();
  const hash = location.hash || '#/';
  if (!session){
    const saved = store.get(SESSION_KEY);
    if (saved){
      try{ session = JSON.parse(saved); meta = await api.open(session.name, session.code); await loadEntries(); }
      catch(e){ session = null; meta = null; if (e.code === 'wrong_code') store.del(SESSION_KEY); }
    }
  }
  if (!session){ if (hash !== '#/') history.replaceState(null,'','#/'); return show('welcome', 0, pageWelcome); }
  const m = hash.match(/^#\/day\/([1-6])$/);
  if (m){
    const n = +m[1];
    if (dayStatus(n) === 'locked'){ history.replaceState(null,'','#/home'); return show('home', 1, pageHome); }
    return show('day'+n, 2, () => pageDay(n));
  }
  if (hash !== '#/home') history.replaceState(null,'','#/home');
  show('home', 1, pageHome);
}
if (!LIVE) $('#demo').append(h('div',{class:'demo-note'}, 'Preview mode: entries stay on this device only. Add your Supabase details in config.js to collect real entries.'));
window.addEventListener('hashchange', route);
route();
})();
</script>
